# Integración continua de las apps, el entrenamiento y el mapa de AZC.
# Corre en cada Pull Request y en cada push a main. Si un trabajo falla, el PR no está listo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  entrenamiento:
    name: Entrenamiento · pruebas numéricas sin corpus privado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r entrenamiento/comparacion_corpus/requirements-numericos.txt
      - run: python -m unittest discover -s entrenamiento/comparacion_corpus/pruebas -v

  mapa:
    name: Mapa AZC · contrato y geometría exportada
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preparar comprobadores geométricos
        run: python -m pip install -r campus/validacion/requirements.txt
      - name: Comprobar plano, visor y contrato del campus
        run: |
          node campus/verificar-compartido.mjs
          node campus/verificar.mjs
          node campus/validacion/verificar_contrato_actual.mjs campus
      - name: Probar exclusión y transformaciones de estacionamientos
        run: |
          node campus/verificar-exclusion-estacionamientos.mjs
          node campus/verificar-estacionamientos-runtime.mjs
      - name: Probar detalles del corpus, sus huellas y transformaciones
        run: |
          node campus/verificar-arquitectura-corpus.mjs
          node campus/verificar-entorno-corpus.mjs
      - name: Probar la auditoría geométrica
        run: python -m unittest discover -s campus/validacion -p 'test_*.py' -v
      - name: Detectar invasiones de edificios en el aparcamiento exportado
        run: python campus/validacion/auditar_estacionamientos.py campus --strict
      - name: Comprobar ejes peatonales a tres alturas
        run: |
          python campus/validacion/auditar_pasajes_glb.py campus --height 1 --strict --summary
          python campus/validacion/auditar_pasajes_glb.py campus --height 1.8 --strict --summary
          python campus/validacion/auditar_pasajes_glb.py campus --height 2.2 --strict --summary
      - name: Comprobar mobiliario exportado frente al corredor completo
        run: python campus/validacion/auditar_entorno_corpus.py campus --strict
      - name: Comprobar que el invernadero queda fuera de los edificios
        run: python campus/validacion/auditar_invernadero_glb.py campus --strict

  flutter:
    name: Flutter · análisis, pruebas y APK de Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # la misma versión del HolaMundoFlutter
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  kmp:
    name: KMP · pruebas y APK de Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-kmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # En Windows, Git guarda gradlew sin permiso de ejecución: se lo damos aquí.
      - run: chmod +x gradlew
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug
