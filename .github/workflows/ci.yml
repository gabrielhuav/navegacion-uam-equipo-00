# Integración continua de las dos apps (Flutter y KMP).
# Corre en cada Pull Request y en cada push a main. Si un trabajo falla, el PR no está listo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    name: Flutter · análisis, pruebas y APK de Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # la misma versión del HolaMundoFlutter
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  kmp:
    name: KMP · pruebas y APK de Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-kmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # En Windows, Git guarda gradlew sin permiso de ejecución: se lo damos aquí.
      - run: chmod +x gradlew
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug
